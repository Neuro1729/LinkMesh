name: Benchmark

# Runs the heavy benchmarks on a clean GitHub runner so the numbers do not
# depend on whatever laptop happened to be handy. Manual trigger, plus a weekly
# run so regressions surface on their own.
on:
  workflow_dispatch:
    inputs:
      dataset:
        description: 'SNAP dataset to index'
        type: choice
        default: web-BerkStan
        options:
          - web-BerkStan
          - web-Google
          - cit-Patents
          - soc-LiveJournal1
      partitions:
        description: 'Partition count'
        default: '32'
      trials:
        description: 'Trials per configuration'
        default: '3'
  schedule:
    - cron: '17 4 * * 1'

jobs:
  benchmark:
    name: index a public web graph
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DATASET: ${{ github.event.inputs.dataset || 'web-BerkStan' }}
      PARTITIONS: ${{ github.event.inputs.partitions || '32' }}
      TRIALS: ${{ github.event.inputs.trials || '3' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Runner specs
        run: |
          echo "cores : $(nproc)"
          echo "model : $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)"
          free -g | awk 'NR==2 {print "memory: " $2 " GB"}'
          df -h / | awk 'NR==2 {print "disk  : " $4 " free"}'

      - name: Build
        run: ./scripts/build.sh

      - name: Fetch dataset
        run: |
          mkdir -p build/graphs
          curl -sS --retry 3 --max-time 900 \
            -o "build/graphs/$DATASET.txt.gz" \
            "https://snap.stanford.edu/data/$DATASET.txt.gz"
          ls -lh "build/graphs/$DATASET.txt.gz"
          echo "--- header ---"
          zcat "build/graphs/$DATASET.txt.gz" | head -4

      - name: Parse into partitions
        run: |
          java -Xmx2g -jar build/linkmesh.jar ingest \
            --edges "build/graphs/$DATASET.txt.gz" \
            --out build/corpus --partitions "$PARTITIONS" --pagesPerFile 2000

      - name: Slot scaling on one node
        run: |
          CORES=$(nproc)
          LIST="1 2"
          [ "$CORES" -ge 4 ] && LIST="1 2 4"
          [ "$CORES" -ge 8 ] && LIST="1 2 4 8"
          CORPUS=build/corpus MODE=slots SLOTS_LIST="$LIST" TRIALS="$TRIALS" \
            NODE_HEAP=5g CONTROLLER_HEAP=512m ./scripts/benchmark.sh

      - name: Cost of splitting one machine into several nodes
        run: |
          CORES=$(nproc)
          TOTAL=2
          [ "$CORES" -ge 4 ] && TOTAL=4
          CORPUS=build/corpus MODE=fixed TOTAL_SLOTS="$TOTAL" NODE_LIST="1 2 4" TRIALS="$TRIALS" \
            NODE_HEAP=3g CONTROLLER_HEAP=512m ./scripts/benchmark.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "## LinkMesh benchmark: \`$DATASET\`"
            echo
            echo "Runner: $(nproc) cores, $(free -g | awk 'NR==2{print $2}') GB RAM"
            echo
            for f in output/benchmark-*.csv; do
              [ -f "$f" ] || continue
              echo "### $(basename "$f" .csv)"
              echo
              echo '```'
              column -s, -t < "$f"
              echo '```'
              echo
            done
            echo "### Last job metrics"
            echo
            echo '```'
            grep METRIC logs/controller.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ github.event.inputs.dataset || 'web-BerkStan' }}
          path: |
            output/benchmark-*.csv
            logs/controller.log
          retention-days: 30
